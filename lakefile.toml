name = "claferCompiler"
version = "0.1.0"
defaultTargets = ["ClaferCompiler", "CompilerTests", "clafer-compiler"]

[leanOptions]
warningAsError = true

[[require]]
name = "clafer"
git = "https://github.com/kbak/clafer-semantics.git"
rev = "a18890612e38872f3fb5842ed323042aea34e1ed"

[[lean_lib]]
name = "ClaferCompiler"
globs = ["ClaferCompiler", "ClaferCompiler.**"]

[[lean_lib]]
name = "CompilerTests"
globs = ["tests.**"]

[[lean_exe]]
name = "clafer-compiler"
root = "Main"
