name = "claferCompiler"
version = "0.1.0"
defaultTargets = ["ClaferCompiler", "CompilerTests", "clafer-compiler"]

[leanOptions]
warningAsError = true

[[require]]
name = "clafer"
git = "https://github.com/kbak/clafer-semantics.git"
rev = "27a5bbe86657edab00980da57b2f86221f92a5f1"

[[lean_lib]]
name = "ClaferCompiler"
globs = ["ClaferCompiler", "ClaferCompiler.**"]

[[lean_lib]]
name = "CompilerTests"
globs = ["tests.**"]

[[lean_exe]]
name = "clafer-compiler"
root = "Main"
