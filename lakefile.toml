name = "claferCompiler"
version = "0.1.0"
defaultTargets = ["ClaferCompiler", "CompilerTests", "clafer-compiler"]

[leanOptions]
warningAsError = true

[[require]]
name = "clafer"
git = "https://github.com/kbak/clafer-semantics.git"
rev = "d677260305076f98d5699542a81a1dceab8c2da6"

[[lean_lib]]
name = "ClaferCompiler"
globs = ["ClaferCompiler", "ClaferCompiler.**"]

[[lean_lib]]
name = "CompilerTests"
globs = ["tests.**"]

[[lean_exe]]
name = "clafer-compiler"
root = "Main"
