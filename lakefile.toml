name = "claferCompiler"
version = "0.1.0"
defaultTargets = ["ClaferCompiler", "CompilerTests", "clafer-compiler"]

[leanOptions]
warningAsError = true

[[require]]
name = "clafer"
git = "https://github.com/kbak/clafer-semantics.git"
rev = "3c63d760be99741617c6af539a9e304909d18b26"

[[lean_lib]]
name = "ClaferCompiler"
globs = ["ClaferCompiler", "ClaferCompiler.**"]

[[lean_lib]]
name = "CompilerTests"
globs = ["tests.**"]

[[lean_exe]]
name = "clafer-compiler"
root = "Main"
