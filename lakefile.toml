name = "claferCompiler"
version = "0.1.0"
defaultTargets = ["ClaferCompiler", "CompilerTests", "clafer-compiler"]

[leanOptions]
warningAsError = true

[[require]]
name = "clafer"
git = "https://github.com/kbak/clafer-semantics.git"
rev = "a450a8062d832fa188794717cf35bc0f60d776f8"

[[lean_lib]]
name = "ClaferCompiler"
globs = ["ClaferCompiler", "ClaferCompiler.**"]

[[lean_lib]]
name = "CompilerTests"
globs = ["tests.**"]

[[lean_exe]]
name = "clafer-compiler"
root = "Main"
