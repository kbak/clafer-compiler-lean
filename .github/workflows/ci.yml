name: CI
on:
  push:
    branches: [main, behavioral]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select:
    name: Select required checks
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.profile.outputs.candidate }}
      baseline: ${{ steps.profile.outputs.baseline }}
      profile: ${{ steps.profile.outputs.profile }}
      reference: ${{ steps.profile.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'behavioral' || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select profile and retain dependency decision
        id: profile
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          ACTION: ${{ github.event.action }}
          BASELINE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/ci_profile.py select --event "$EVENT" --base-ref "$BASE_REF" \
            --ref "$REF" --action "$ACTION" --baseline "$BASELINE" \
            --output "$GITHUB_OUTPUT" --record "$RUNNER_TEMP/ci-selection.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-selection
          path: ${{ runner.temp }}/ci-selection.json
          retention-days: 30
  compiler:
    name: Compiler and proofs
    needs: select
    uses: ./.github/workflows/validate.yml
    with:
      profile: ${{ needs.select.outputs.profile }}
      candidate: ${{ needs.select.outputs.candidate }}
      baseline: ${{ needs.select.outputs.baseline }}
  source:
    name: Behavioral source qualification
    needs: select
    if: needs.select.outputs.profile == 'compiler'
    uses: ./.github/workflows/validate.yml
    with:
      profile: source
      candidate: ${{ needs.select.outputs.candidate }}
      baseline: ${{ needs.select.outputs.baseline }}
  reference:
    name: Reference qualification
    needs: select
    if: needs.select.outputs.reference == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      profile: reference
      candidate: ${{ needs.select.outputs.candidate }}
      baseline: ${{ needs.select.outputs.baseline }}
  build:
    name: Lean proofs and native CLI
    needs: [select, compiler, source, reference]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected job
        env:
          SELECTION: ${{ needs.select.result }}
          COMPILER: ${{ needs.compiler.result }}
          SOURCE: ${{ needs.source.result }}
          PROFILE: ${{ needs.select.outputs.profile }}
          REFERENCE: ${{ needs.reference.result }}
          REQUIRED: ${{ needs.select.outputs.reference }}
        run: |
          test "$SELECTION" = success
          test "$COMPILER" = success
          if [ "$PROFILE" = compiler ]; then
            test "$SOURCE" = success
          else
            test "$PROFILE" = routine
            test "$SOURCE" = skipped
          fi
          if [ "$REQUIRED" = true ]; then
            test "$REFERENCE" = success
          else
            test "$REQUIRED" = false
            test "$REFERENCE" = skipped
          fi
